name: Validate lean CEA eligibility export

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pytest

      - name: Fit smooth smoking-history model
        run: python scripts/build_smooth_smoking_history_outputs.py

      - name: Regenerate lean CEA export package
        run: python scripts/export_cea_population_inputs.py

      - name: Run export tests
        run: pytest -q tests/test_cea_population_export.py

      - name: Upload generated package and internal QA
        uses: actions/upload-artifact@v4
        with:
          name: lean-cea-eligibility-export
          path: |
            data_processed/plco_smoking_history_synthetic_pool.csv
            data_processed/smoking_history_generation_parameters.json
            data_processed/smoking_history_model_diagnostics.csv
            data_processed/smoking_history_cleaning_audit.csv
            data_processed/smoking_history_residual_donor_audit.csv
            export_for_cea

      - name: Commit verified generated outputs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data_processed/plco_smoking_history_synthetic_pool.csv \
            data_processed/smoking_history_generation_parameters.json \
            data_processed/smoking_history_model_diagnostics.csv \
            data_processed/smoking_history_cleaning_audit.csv \
            data_processed/smoking_history_residual_donor_audit.csv
          git add -A export_for_cea
          if git diff --cached --quiet; then
            echo "Generated outputs are already current."
          else
            git commit -m "Regenerate lean CEA eligibility export"
            git push origin HEAD:${{ github.head_ref }}
          fi
